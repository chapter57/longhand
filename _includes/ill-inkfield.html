{%- comment -%} The front page's ink field: one drop of ink for each day of the
almanac. Days that have opened are inked, each in a shape grown from the name
of its writer; today's is wet and blue; days still to come are only faint
rings. assets/almanac.js draws it. {%- endcomment -%}
<figure class="inkfield" data-almanac-ink>
  <div class="inkfield-drops" data-almanac-ink-drops></div>
  <figcaption class="inkfield-note" data-almanac-ink-note>A drop of ink for every day of the almanac.</figcaption>
</figure>
