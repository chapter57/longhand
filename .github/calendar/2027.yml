    quote: We are such stuff / As dreams are made on.
    by: William Shakespeare · The Tempest, 1611
    bio: Baptized April 26, 1564, in Stratford-upon-Avon, and traditionally said to have been born on April 23, the same day of the year he died. Thirty-seven plays, 154 sonnets, and about seventeen hundred words we still use.
