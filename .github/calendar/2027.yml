    quote: When Gregor Samsa woke one morning from troubled dreams, he found himself changed in his bed into a monstrous insect.
    by: Franz Kafka · The Metamorphosis, 1915 (our translation)
    bio: Born July 3, 1883, in Prague. He worked all day at an insurance office and wrote all night. He asked his best friend to burn everything he left behind. His friend said no.
