    quote: I am large, I contain multitudes.
    by: Walt Whitman · “Song of Myself,” 1855
    bio: Born May 31, 1819, on Long Island. When no publisher would touch Leaves of Grass, he paid for it himself and set some of the type with his own hands. He spent the rest of his life rewriting it.
