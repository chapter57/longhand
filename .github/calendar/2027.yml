    portrait: poe
    color: "#8e7cc3"
    dark: "#4b3d82"
    tint: "#ece8f6"
    day: 19
    quote: "All that we see or seem / Is but a dream within a dream."
    by: Edgar Allan Poe · “A Dream Within a Dream,” 1849
    bio: Born January 19, 1809, in Boston, to a pair of traveling actors. He invented the detective story, perfected the horror story, and died at forty in Baltimore, in circumstances no one has ever explained.
    days: [J. D. Salinger, Isaac Asimov, J. R. R. Tolkien, Jacob Grimm, Umberto Eco, Kahlil Gibran, Zora Neale Hurston, Wilkie Collins, Simone de Beauvoir, Robinson Jeffers, William James, Jack London, † James Joyce, John Dos Passos, Molière, Susan Sontag, Anne Brontë, A. A. Milne, Edgar Allan Poe, Joy Adamson, † George Orwell, Lord Byron, Stendhal, Edith Wharton, Virginia Woolf · Robert Burns, Philip José Farmer, Lewis Carroll, Colette, Anton Chekhov, Richard Brautigan, Norman Mailer]
  - name: February
    portrait: dickens
    color: "#5fa35a"
    dark: "#2f6a2b"
    tint: "#e6f2e4"
    day: 7
    quote: It was the best of times, it was the worst of times.
    by: Charles Dickens · A Tale of Two Cities, 1859
    bio: Born February 7, 1812, in Portsmouth. At twelve he was pasting labels on bottles of boot polish in a blacking factory while his father sat in debtors' prison. He never forgot it, and neither do his readers.
