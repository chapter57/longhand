# The Longhand Almanac 2027: a wall calendar. One writer a month (portrait,
# quote, a few lines), and a writer in every day of the grid. "†" means the
# writer died that day; anything else is a birthday or a book's anniversary.
# Quotes are all public domain or our own translations.
year: 2027
holidays:
  "1-1": New Year's Day
  "1-18": Martin Luther King Jr. Day
  "2-15": Presidents' Day
  "5-31": Memorial Day
  "6-19": Juneteenth
  "7-4": Independence Day
  "9-6": Labor Day
  "10-11": Indigenous Peoples' Day
  "11-11": Veterans Day
  "11-25": Thanksgiving
  "12-25": Christmas
months:
