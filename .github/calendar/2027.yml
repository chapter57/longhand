    by: Federico García Lorca · “Romance sonámbulo,” 1928 (our translation)
    bio: Born June 5, 1898, in Fuente Vaqueros, near Granada. Poet, playwright, pianist, puppeteer. He was killed at thirty-eight in the first weeks of the Spanish Civil War, and his grave has never been found.
