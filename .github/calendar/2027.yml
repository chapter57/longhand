    quote: All happy families are alike; each unhappy family is unhappy in its own way.
    by: Leo Tolstoy · Anna Karenina, 1878
    bio: Born September 9, 1828, at Yasnaya Polyana, the estate where he lived most of his life. He wrote two of the greatest novels ever written, then gave up his copyrights, dressed like a peasant, and made his own boots.
