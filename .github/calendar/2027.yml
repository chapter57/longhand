    dark: "#a83d5c"
    tint: "#fbe7ed"
    day: 6
    quote: How do I love thee? Let me count the ways.
    by: Elizabeth Barrett Browning · Sonnets from the Portuguese, 1850
    bio: Born March 6, 1806. The most famous poet in England when Robert Browning wrote to say he loved her verses, “and I love you too.” They married in secret and ran away to Italy.
