    by: Arthur Rimbaud · letter to Paul Demeny, 1871 (our translation)
    bio: Born October 20, 1854, in Charleville. He wrote all of his poetry before he was twenty-one, walked away from it, and spent the rest of his short life trading coffee and guns in Africa.
