# Posts the day's almanac to Bluesky and Mastodon three times a day: the
# entry in the morning, a quote at midday and a quote card in the evening,
# which also goes to Instagram. A meme (or a portrait card) goes to Bluesky
# and Instagram every afternoon, and a reel on Sundays and Wednesdays.
# The script is .github/scripts/post_almanac.py. The accounts' passwords are
# kept in the project's Settings → Secrets and variables → Actions.
name: Post the almanac

on:
  schedule:
    # Times are UTC; New York is 4 hours behind in summer, 5 in winter.
    # GitHub sometimes starts scheduled runs late, or skips them when it's
    # busy, so the morning and evening posts each have a backup run that only
    # posts what the first run didn't.
    - cron: "47 13 * * *"   # morning: 9:47 a.m. summer, 8:47 a.m. winter
    - cron: "23 15 * * *"   # morning backup
    - cron: "7 17 * * *"    # midday: 1:07 p.m. summer, 12:07 p.m. winter
    - cron: "47 19 * * *"   # meme, on days that have one: 3:47 p.m. summer, 2:47 p.m. winter
    - cron: "17 18 * * 0,3" # reel, Sundays and Wednesdays: 2:17 p.m. summer, 1:17 p.m. winter
    - cron: "37 20 * * *"   # evening: 4:37 p.m. summer, 3:37 p.m. winter (GitHub has been
                            # starting these hours late, so it posts in the evening anyway)
    - cron: "53 22 * * *"   # evening backup
  workflow_dispatch:
    inputs:
      slot:
        description: "Which post"
        type: choice
        options: [morning, midday, meme, evening, announcement, instagram, reel]
        default: morning
      announcement:
        description: 'For "announcement", "instagram", "meme" or "reel": the post''s id in _data/announcements.yml, instagram.yml, memes.yml or reels.yml'
        required: false
        default: ""
      date:
        description: 'Post another day instead of today, as "MM-DD" (e.g. 11-30). Leave empty for today.'
        required: false
        default: ""
      dry_run:
        description: "Only show what would be posted, without posting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Work out the day and which post this is
        id: day
        env:
          SCHEDULE: ${{ github.event.schedule }}
          CHOSEN: ${{ inputs.slot }}
        run: |
          echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          case "$SCHEDULE" in
            "47 13 * * *"|"23 15 * * *") slot=morning ;;
            "7 17 * * *") slot=midday ;;
            "47 19 * * *") slot=meme ;;
            "17 18 * * 0,3") slot=reel ;;
            "37 20 * * *"|"53 22 * * *") slot=evening ;;
            *) slot="${CHOSEN:-morning}" ;;
          esac
          # A scheduled evening run that GitHub starts after midnight in New
          # York would post the new day's evening card in the small hours, so
          # it's skipped instead.
          if [ -n "$SCHEDULE" ] && [ "$slot" = evening ] && [ "$(TZ=America/New_York date +%-H)" -lt 12 ]; then
            echo "Too late for last night's evening post; skipping."
            slot=skip
          fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
      # Remembers which posts have already gone out today.
      - uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-${{ steps.day.outputs.date }}-${{ github.run_id }}
          restore-keys: posted-${{ steps.day.outputs.date }}-
      # The renewed Instagram token (locked; see the script).
      - uses: actions/cache/restore@v4
        if: steps.day.outputs.slot != 'skip'
        with:
          path: .instagram
          key: instagram-${{ github.run_id }}
          restore-keys: instagram-
      - run: python .github/scripts/post_almanac.py
        if: steps.day.outputs.slot != 'skip'
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_DIR: .instagram
          INSTAGRAM_IMAGE_BASE: ${{ github.ref_name != 'gh-pages' && format('https://raw.githubusercontent.com/{0}/{1}', github.repository, github.ref_name) || '' }}
          SLOT: ${{ steps.day.outputs.slot }}
          ANNOUNCEMENT: ${{ inputs.announcement }}
          ALMANAC_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          # A run by hand for another day posts regardless.
          POSTED_DIR: ${{ inputs.date == '' && '.posted' || '' }}
      - uses: actions/cache/save@v4
        if: always() && steps.day.outputs.slot != 'skip'
        with:
          path: .posted
          key: posted-${{ steps.day.outputs.date }}-${{ github.run_id }}
      - uses: actions/cache/save@v4
        if: always() && hashFiles('.instagram/token') != ''
        with:
          path: .instagram
          key: instagram-${{ github.run_id }}
