# Posts the day's almanac entry to Bluesky and Mastodon every morning.
# The script is .github/scripts/post_almanac.py. The accounts' passwords are
# kept in the project's Settings → Secrets and variables → Actions.
name: Post the almanac

on:
  schedule:
    # GitHub sometimes starts scheduled runs late, or skips them when it's
    # busy, so there are two: the morning one, and a backup a few hours later
    # that only posts to accounts the morning run didn't reach. Times are UTC:
    # 13:47 is 9:47 a.m. in New York in summer, 8:47 a.m. in winter.
    - cron: "47 13 * * *"
    - cron: "23 17 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: 'Post another day instead of today, as "MM-DD" (e.g. 11-30). Leave empty for today.'
        required: false
        default: ""
      dry_run:
        description: "Only show what would be posted, without posting"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Note today's date in New York
        id: day
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      # Remembers which accounts have already posted today's entry.
      - uses: actions/cache/restore@v4
        with:
          path: .posted
          key: posted-${{ steps.day.outputs.date }}-${{ github.run_id }}
          restore-keys: posted-${{ steps.day.outputs.date }}-
      - run: python .github/scripts/post_almanac.py
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          ALMANAC_DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          # A run by hand for another day posts regardless.
          POSTED_DIR: ${{ inputs.date == '' && '.posted' || '' }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .posted
          key: posted-${{ steps.day.outputs.date }}-${{ github.run_id }}
