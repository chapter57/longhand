# Downloads the almanac's portraits from Wikimedia Commons into
# .github/instagram/portraits/, for drawing Instagram slides, and commits them
# to the branch it runs on. Run by hand from the Actions tab.
name: Fetch portraits

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python .github/scripts/fetch_portraits.py
      - name: Commit the portraits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add .github/instagram/portraits
          git diff --cached --quiet || git commit -m "Fetch the almanac portraits from Wikimedia Commons"
          git push
