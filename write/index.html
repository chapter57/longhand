<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{height:100%}body{margin:0}[hidden]{display:none!important}</style>
<title>Longhand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400;1,7..72,600&display=swap">
<style>
  :root {
    --paper: #F2F3EE;
    --ink: #1E2227;
    --ink-soft: #62686F;
    --ink-faint: #999EA3;
    --rule: #D8DBD2;
    --surface: #E7E9E2;
    --accent: #2F4F78;
    --accent-wash: rgba(47, 79, 120, 0.16);
    --warn: #9A3B2E;
    --shadow: rgba(20, 24, 30, 0.14);
    --text-size: 19px;
    --serif: "Literata", Georgia, "Times New Roman", serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #141619;
      --ink: #DAD7CF;
      --ink-soft: #8F949A;
      --ink-faint: #5F646A;
      --rule: #282B30;
      --surface: #1C1F23;
      --accent: #9DB6D6;
      --accent-wash: rgba(157, 182, 214, 0.22);
      --warn: #E39A8A;
      --shadow: rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #141619;
    --ink: #DAD7CF;
    --ink-soft: #8F949A;
    --ink-faint: #5F646A;
    --rule: #282B30;
    --surface: #1C1F23;
    --accent: #9DB6D6;
    --accent-wash: rgba(157, 182, 214, 0.22);
    --warn: #E39A8A;
    --shadow: rgba(0, 0, 0, 0.5);
  }

  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: var(--mono); font-size: 12px; min-height: 100%; }
  ::selection { background: var(--accent-wash); }

  button {
    font: inherit; color: inherit; background: none; border: 0;
    padding: 6px 8px; border-radius: 4px; cursor: pointer;
    transition: background-color .2s, color .2s;
  }
  button:hover { color: var(--ink); background: var(--surface); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button[aria-pressed="true"] { color: var(--accent); }
  button[aria-pressed="true"]::before {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; margin-right: 6px; vertical-align: 2px;
  }

  .bar { color: var(--ink-soft); background: var(--paper); transition: opacity .7s ease; }
  body.quiet .bar { opacity: 0; }
  body.quiet .bar:focus-within { opacity: 1; }

  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px;
    padding-inline: 16px; padding-block: 10px;
  }
  .mark { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink); letter-spacing: .01em; }
  .piece-title {
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--ink-faint);
  }
  .tools { display: flex; flex-wrap: wrap; gap: 2px; margin-left: auto; }
  .tools .sep { width: 1px; background: var(--rule); margin: 6px 4px; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px;
    padding-inline: 16px;
    padding-block: 6px calc(6px + env(safe-area-inset-bottom, 0px));
    font-size: 11.5px; font-variant-numeric: tabular-nums;
  }
  .bottom .push { margin-left: auto; }
  #saveState.warn { color: var(--warn); }

  main { padding-inline: 16px; }
  #editor {
    max-width: 34em; margin-inline: auto;
    font-family: var(--serif); font-size: var(--text-size); line-height: 1.72;
    font-optical-sizing: auto; overflow-wrap: break-word;
    padding-block: 9vh 55vh; outline: none; caret-color: var(--accent);
  }
  #editor.typewriter { padding-top: 42vh; }
  #editor > p, #editor > div { margin: 0 0 .9em; position: relative; }
  #editor > h2 {
    font-weight: 600; font-size: 1.32em; line-height: 1.3; letter-spacing: -.005em;
    margin: 1.7em 0 .6em; text-wrap: balance;
  }
  #editor > h2:first-child { margin-top: 0; }
  #editor.empty > :first-child::before {
    content: "Begin anywhere."; position: absolute; color: var(--ink-faint); pointer-events: none;
    font-style: italic;
  }
  #editor.focus > * { transition: opacity .45s ease; }
  #editor.focus > :not(.current) { opacity: .24; }

  #scrim { position: fixed; inset: 0; background: var(--shadow); z-index: 15; }
  #drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 20;
    width: min(340px, 88vw); background: var(--surface); overflow-y: auto;
    padding-inline: 16px;
    padding-block: calc(16px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-bottom, 0px));
    box-shadow: 1px 0 0 var(--rule), 16px 0 48px var(--shadow);
    display: flex; flex-direction: column; gap: 14px;
  }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .drawer-head h2 { margin: 0; font-family: var(--serif); font-size: 18px; font-weight: 600; color: var(--ink); }
  #newBtn { color: var(--accent); border: 1px solid var(--rule); padding: 6px 10px; }
  #pieceList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  .piece { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: start; border-top: 1px solid var(--rule); padding-block: 8px; }
  .piece-open { text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .piece-open .t {
    font-family: var(--serif); font-size: 15.5px; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .piece[aria-current="true"] .t { color: var(--accent); }
  .piece-open .m { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .piece-del { font-size: 11px; color: var(--ink-faint); }
  .piece-del:hover { color: var(--warn); }
  .drawer-note { margin: auto 0 0; color: var(--ink-soft); line-height: 1.6; font-size: 11.5px; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 30;
    bottom: calc(44px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px);
    background: var(--ink); color: var(--paper); border-radius: 6px;
    padding: 8px 8px 8px 14px; font-size: 12px; box-shadow: 0 6px 24px var(--shadow);
  }
  #toast button { color: var(--paper); text-decoration: underline; text-underline-offset: 3px; }
  #toast button:hover { background: transparent; opacity: .8; }

  @media (max-width: 640px) {
    .piece-title { display: none; }
    .tools { margin-left: 0; }
    #editor { line-height: 1.66; padding-top: 4vh; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar, #editor.focus > *, button { transition: none; }
  }
</style>
</head>
<body>

<header class="bar top" id="topbar">
  <span class="mark">Longhand</span>
  <button id="drawerBtn" aria-expanded="false" aria-controls="drawer">Pieces</button>
  <span class="piece-title" id="pieceTitle"></span>
  <div class="tools">
    <button id="focusBtn" aria-pressed="false" title="Dim everything but the paragraph you're in">Focus</button>
    <button id="typeBtn" aria-pressed="false" title="Keep the line you're writing in the middle of the screen">Typewriter</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="sizeDown" title="Smaller text" aria-label="Smaller text">A−</button>
    <button id="sizeUp" title="Larger text" aria-label="Larger text">A+</button>
    <span class="sep" aria-hidden="true"></span>
    <button id="copyBtn" title="Copy this piece, with italics and headings, to paste anywhere">Copy</button>
    <button id="downloadBtn" title="Save this piece as a text file">Download</button>
  </div>
</header>

<div id="scrim" hidden></div>
<aside id="drawer" hidden aria-label="Your pieces">
  <div class="drawer-head">
    <h2>Your pieces</h2>
    <button id="newBtn">New piece</button>
  </div>
  <ul id="pieceList"></ul>
  <p class="drawer-note">Everything you write is kept in this browser, on this device. Nothing is sent anywhere. Use Copy or Download to take a piece with you.</p>
</aside>

<main>
  <article id="editor" contenteditable="true" spellcheck="false" aria-label="Writing area" aria-multiline="true" role="textbox"></article>
</main>

<footer class="bar bottom" id="statusbar">
  <span id="wordCount">0 words</span>
  <span id="readTime"></span>
  <span id="today"></span>
  <span id="sitting"></span>
  <span class="push" id="saveState" aria-live="polite"></span>
  <button id="spellBtn" aria-pressed="false" title="Show spelling underlines">Spelling</button>
</footer>

<div id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastAction" hidden>Undo</button></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const editor = $("editor");
  const KEY = "longhand.v1";
  const SIZES = [16, 17.5, 19, 21, 23.5];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---------- storage (never trusted to exist) ----------
  const store = {
    get() { try { const v = localStorage.getItem(KEY); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); return true; } catch (e) { return false; } },
  };

  // ---------- cleaning HTML down to paragraphs, headings, italic, bold ----------
  const BLOCK = /^(P|DIV|H[1-6]|BLOCKQUOTE|LI|PRE)$/;
  const CONTAINER = /^(UL|OL|SECTION|ARTICLE|MAIN|HEADER|FOOTER|TABLE|THEAD|TBODY|TR|TD|TH|BODY|HTML)$/;
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function inlineOf(n) {
    if (n.nodeType === 3) return esc(n.nodeValue.replace(/[\t\r\n]+/g, " ").replace(/ /g, " "));
    if (n.nodeType !== 1) return "";
    const t = n.tagName;
    if (t === "BR") return "<br>";
    if (/^(SCRIPT|STYLE|META|LINK|TITLE|HEAD)$/.test(t)) return "";
    const st = n.getAttribute("style") || "";
    let inner = inlineChildren(n);
    const italic = t === "EM" || t === "I" || /font-style:\s*italic/i.test(st);
    const bold = ((t === "STRONG" || t === "B") && !/font-weight:\s*(normal|[1-5]00)/i.test(st))
      || /font-weight:\s*(bold|[6-9]00)/i.test(st);
    if (bold && inner.trim()) inner = "<strong>" + inner + "</strong>";
    if (italic && inner.trim()) inner = "<em>" + inner + "</em>";
    return inner;
  }
  function inlineChildren(el) { let s = ""; el.childNodes.forEach((c) => { s += inlineOf(c); }); return s; }
  function hasBlockChild(el) {
    for (const c of el.children) if (BLOCK.test(c.tagName) || CONTAINER.test(c.tagName) || hasBlockChild(c)) return true;
    return false;
  }
  function blocksOf(root) {
    const out = [];
    let loose = "";
    const flush = () => { if (loose.replace(/<br>/g, "").trim()) out.push({ tag: "p", html: loose.trim() }); loose = ""; };
    root.childNodes.forEach((n) => {
      if (n.nodeType === 1 && (BLOCK.test(n.tagName) || CONTAINER.test(n.tagName) || hasBlockChild(n))) {
        flush();
        if (!BLOCK.test(n.tagName) || hasBlockChild(n)) { out.push(...blocksOf(n)); return; }
        const html = inlineChildren(n).replace(/(<br>)+$/, "");
        out.push({ tag: /^H/.test(n.tagName) ? "h2" : "p", html: html.trim() ? html : "" });
      } else {
        loose += inlineOf(n);
      }
    });
    flush();
    return out;
  }
  const toHTML = (blocks) => blocks.map((b) => `<${b.tag}>${b.html || "<br>"}</${b.tag}>`).join("");
  function parse(html) { const t = document.createElement("template"); t.innerHTML = html || ""; return t.content; }

  // ---------- small helpers ----------
  const fmt = (n) => n.toLocaleString();
  const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  function wordsIn(text) { return (text.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu) || []).length; }
  function blockTexts(root) { return [...root.children].map((c) => c.textContent); }
  function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
  function ago(t) {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return "just now";
    const m = Math.round(s / 60); if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60); if (h < 24) return `${h} ${h === 1 ? "hour" : "hours"} ago`;
    const d = Math.round(h / 24); if (d === 1) return "yesterday"; if (d < 7) return `${d} days ago`;
    return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function titleOfHTML(html) {
    const t = [...parse(html).children].map((c) => c.textContent.trim()).find(Boolean);
    return t ? (t.length > 60 ? t.slice(0, 58).trim() + "…" : t) : "Untitled";
  }

  // ---------- state ----------
  const STARTER = [
    ["h2", "Start here"],
    ["p", "This is Longhand, a quiet place to write. There is nothing to set up. Click at the end of this page and begin, or open <em>Pieces</em> and start a fresh one."],
    ["p", "Your words are saved as you go, in this browser on this device. There is no account, and nothing is sent anywhere."],
    ["p", "Quotes curl themselves as you type: “Like this,” she said. Two hyphens become a dash — like that. Three dots become an ellipsis…"],
    ["p", "Type # and a space at the start of a line to make a heading. Press Ctrl+I for <em>italics</em> and Ctrl+B for <strong>bold</strong> (on a Mac, ⌘I and ⌘B)."],
    ["p", "<em>Focus</em> dims everything except the paragraph you are in. <em>Typewriter</em> keeps the line you are writing in the middle of the screen, so your eyes can stay put."],
    ["p", "The buttons fade away while you type. Move the mouse or press Esc and they come back. Spelling underlines are off until you ask for them, so they don’t interrupt a first draft."],
    ["p", "At the bottom you’ll see how many words you’ve added today and how long you’ve been at it this sitting. You can delete this page whenever you like."],
  ].map(([t, h]) => `<${t}>${h}</${t}>`).join("");

  function newPiece(html) {
    const h = html || "<p><br></p>";
    return { id: uid(), html: h, updated: Date.now(), words: wordsIn(blockTexts(parse(h)).join(" ")) };
  }

  let state = store.get();
  if (!state || !Array.isArray(state.pieces) || !state.pieces.length) {
    const first = newPiece(STARTER);
    state = { pieces: [first], current: first.id };
  }
  state.prefs = Object.assign({ focus: false, typewriter: false, size: 2, spell: false }, state.prefs || {});
  if (!state.pieces.some((p) => p.id === state.current)) state.current = state.pieces[0].id;
  const totalWords = () => state.pieces.reduce((s, p) => s + (p.words || 0), 0);
  function ensureToday() {
    const k = todayKey();
    if (!state.today || state.today.date !== k) state.today = { date: k, start: totalWords() };
  }
  ensureToday();
  const piece = () => state.pieces.find((p) => p.id === state.current);

  // ---------- saving ----------
  let saveTimer = 0;
  function setSaved(ok) {
    const s = $("saveState");
    s.classList.toggle("warn", !ok);
    s.textContent = ok ? "Saved" : "This browser won’t let Longhand save. Copy your work before you close the page.";
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    if (!$("saveState").classList.contains("warn")) $("saveState").textContent = "";
    saveTimer = setTimeout(saveNow, 700);
  }
  function saveNow() {
    clearTimeout(saveTimer);
    const p = piece();
    if (!p) return;
    const html = toHTML(blocksOf(editor));
    if (html !== p.html) { p.html = html; p.updated = Date.now(); }
    p.words = countWords();
    setSaved(store.set(state));
  }
  function persistQuietly() { if (!store.set(state)) setSaved(false); }
  addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") saveNow(); });
  addEventListener("pagehide", saveNow);

  // ---------- selection helpers ----------
  function blockOf(node) {
    if (!node) return null;
    if (node === editor) return null;
    while (node && node.parentNode !== editor) node = node.parentNode;
    return node && node.nodeType === 1 ? node : null;
  }
  function currentBlock() {
    const sel = getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
    if (sel.anchorNode === editor) {
      const kids = editor.children;
      return kids[Math.min(sel.anchorOffset, kids.length - 1)] || null;
    }
    return blockOf(sel.anchorNode);
  }
  function textBeforeCaret() {
    const sel = getSelection();
    const block = currentBlock();
    if (!sel.rangeCount || !block) return "";
    const r = sel.getRangeAt(0);
    const pre = document.createRange();
    pre.selectNodeContents(block);
    try { pre.setEnd(r.startContainer, r.startOffset); } catch (e) { return ""; }
    return pre.toString();
  }
  function placeCaret(el, atEnd) {
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(!atEnd);
    const sel = getSelection();
    sel.removeAllRanges();
    sel.addRange(r);
  }
  const ins = (s) => document.execCommand("insertText", false, s);

  // Keep the editor made of blocks, even after select-all + delete.
  function ensureStructure() {
    if (!editor.firstChild || (editor.childNodes.length === 1 && editor.firstChild.nodeName === "BR")) {
      editor.innerHTML = "<p><br></p>";
      placeCaret(editor.firstChild);
      return;
    }
    const sel = getSelection();
    const a = sel.anchorNode, o = sel.anchorOffset;
    let moved = false;
    [...editor.childNodes].forEach((n) => {
      if (n.nodeType === 3 && n.nodeValue.trim()) {
        const p = document.createElement("p");
        editor.insertBefore(p, n);
        p.appendChild(n);
        moved = true;
      }
    });
    if (moved && a && editor.contains(a)) { try { sel.collapse(a, o); } catch (e) {} }
  }

  // ---------- typing niceties ----------
  document.execCommand("defaultParagraphSeparator", false, "p");

  editor.addEventListener("beforeinput", (e) => {
    if (e.inputType !== "insertText" || !e.data || e.data.length !== 1) return;
    const sel = getSelection();
    if (!sel.isCollapsed) return;
    const d = e.data;
    const before = textBeforeCaret();
    const prev = before.slice(-1);
    const opening = prev === "" || /[\s(\[{“‘—–-]/.test(prev);
    if (d === '"') { e.preventDefault(); ins(opening ? "“" : "”"); }
    else if (d === "'") { e.preventDefault(); ins(opening ? "‘" : "’"); }
    else if (d === "-" && prev === "-") { e.preventDefault(); document.execCommand("delete"); ins("—"); }
    else if (d === "." && before.slice(-2) === "..") {
      e.preventDefault(); document.execCommand("delete"); document.execCommand("delete"); ins("…");
    }
    else if (d === " " && before === "#" && currentBlock() && currentBlock().tagName !== "H2") {
      e.preventDefault(); document.execCommand("delete"); document.execCommand("formatBlock", false, "h2");
    }
  });

  editor.addEventListener("input", (e) => {
    ensureStructure();
    if (e.inputType === "insertParagraph") {
      const b = currentBlock();
      if (b && b.tagName === "H2" && !b.textContent.trim()) document.execCommand("formatBlock", false, "p");
    }
    afterChange();
    requestAnimationFrame(keepCaretInView);
  });

  editor.addEventListener("paste", (e) => {
    const cd = e.clipboardData;
    if (!cd) return;
    e.preventDefault();
    let blocks = [];
    const html = cd.getData("text/html");
    if (html) blocks = blocksOf(parse(html)).filter((b) => b.html.replace(/<br>/g, "").trim());
    if (!blocks.length) {
      blocks = cd.getData("text/plain").split(/\r?\n/).filter((l) => l.trim()).map((l) => ({ tag: "p", html: esc(l.trim()) }));
    }
    if (!blocks.length) return;
    if (blocks.length === 1 && blocks[0].tag === "p") document.execCommand("insertHTML", false, blocks[0].html);
    else document.execCommand("insertHTML", false, toHTML(blocks));
  });

  // ---------- keys ----------
  let sittingMs = 0, lastKey = 0, quietFrom = null;
  editor.addEventListener("keydown", (e) => {
    const now = Date.now();
    if (lastKey && now - lastKey < 90000) sittingMs += now - lastKey;
    lastKey = now;

    if (e.key === "Tab") { e.preventDefault(); return; }
    if (e.key === "Escape") { wake(); editor.blur(); return; }
    if (e.key === "Backspace" && getSelection().isCollapsed) {
      const b = currentBlock();
      if (b && b.tagName === "H2" && textBeforeCaret() === "") { e.preventDefault(); document.execCommand("formatBlock", false, "p"); return; }
    }
    if (!e.metaKey && !e.ctrlKey && !e.altKey && (e.key.length === 1 || e.key === "Enter" || e.key === "Backspace")) goQuiet();
  });
  editor.addEventListener("keyup", (e) => {
    if (/^(Arrow|Page|Home|End)/.test(e.key)) requestAnimationFrame(keepCaretInView);
  });
  addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveNow(); toast("Saved. Longhand also saves on its own as you write."); }
    if (e.key === "Escape" && !$("drawer").hidden) closeDrawer();
  });

  // ---------- quiet chrome ----------
  function goQuiet() {
    if (!$("drawer").hidden) return;
    document.body.classList.add("quiet");
    quietFrom = null;
  }
  function wake() { document.body.classList.remove("quiet"); quietFrom = null; }
  addEventListener("mousemove", (e) => {
    if (!document.body.classList.contains("quiet")) return;
    if (!quietFrom) { quietFrom = [e.clientX, e.clientY]; return; }
    if (Math.abs(e.clientX - quietFrom[0]) + Math.abs(e.clientY - quietFrom[1]) > 24) wake();
  });
  addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse" && !editor.contains(e.target)) wake(); });

  // ---------- caret position ----------
  function caretRect() {
    const sel = getSelection();
    if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
    const r = sel.getRangeAt(0).cloneRange();
    r.collapse(false);
    const rects = r.getClientRects();
    if (rects.length) return rects[rects.length - 1];
    const b = currentBlock();
    return b ? b.getBoundingClientRect() : null;
  }
  function keepCaretInView() {
    if (document.activeElement !== editor) return;
    const rect = caretRect();
    if (!rect) return;
    if (state.prefs.typewriter) {
      const delta = rect.top + rect.height / 2 - innerHeight * 0.45;
      if (Math.abs(delta) > 2) window.scrollBy({ top: delta, behavior: reduceMotion || Math.abs(delta) < 80 ? "auto" : "smooth" });
    } else {
      const limit = innerHeight - $("statusbar").offsetHeight - 36;
      if (rect.bottom > limit) window.scrollBy({ top: rect.bottom - limit + 24 });
    }
  }

  // ---------- focus mode: mark the paragraph you're in ----------
  let currentEl = null;
  document.addEventListener("selectionchange", () => {
    const b = currentBlock();
    if (!b || b === currentEl) return;
    if (currentEl) currentEl.classList.remove("current");
    b.classList.add("current");
    currentEl = b;
  });

  // ---------- stats ----------
  function countWords() { return wordsIn(blockTexts(editor).join(" ")); }
  let statsTimer = 0;
  function afterChange() {
    editor.classList.toggle("empty", editor.children.length <= 1 && !editor.textContent.trim());
    clearTimeout(statsTimer);
    statsTimer = setTimeout(updateStats, 220);
    scheduleSave();
  }
  function updateStats() {
    const n = countWords();
    const p = piece();
    if (p) p.words = n;
    $("wordCount").textContent = plural(n, "word");
    $("readTime").textContent = n ? `${Math.max(1, Math.round(n / 230))} min read` : "";
    ensureToday();
    const added = totalWords() - state.today.start;
    $("today").textContent = added > 0 ? `+${fmt(added)} today` : added < 0 ? `${fmt(-added)} cut today` : "Nothing added yet today";
    const mins = Math.floor(sittingMs / 60000);
    $("sitting").textContent = mins >= 1 ? `${mins} min this sitting` : "";
    const first = [...editor.children].map((c) => c.textContent.trim()).find(Boolean);
    const title = first ? (first.length > 60 ? first.slice(0, 58).trim() + "…" : first) : "Untitled";
    $("pieceTitle").textContent = title;
    document.title = first ? `${title} · Longhand` : "Longhand";
  }
  setInterval(updateStats, 30000);

  // ---------- loading a piece ----------
  function load(id) {
    state.current = id;
    const p = piece();
    editor.innerHTML = toHTML(blocksOf(parse(p.html))) || "<p><br></p>";
    currentEl = null;
    editor.classList.toggle("empty", editor.children.length <= 1 && !editor.textContent.trim());
    updateStats();
    window.scrollTo(0, 0);
  }

  // ---------- prefs ----------
  function applyPrefs() {
    const pr = state.prefs;
    editor.classList.toggle("focus", pr.focus);
    editor.classList.toggle("typewriter", pr.typewriter);
    $("focusBtn").setAttribute("aria-pressed", pr.focus);
    $("typeBtn").setAttribute("aria-pressed", pr.typewriter);
    $("spellBtn").setAttribute("aria-pressed", pr.spell);
    editor.spellcheck = pr.spell;
    pr.size = Math.max(0, Math.min(SIZES.length - 1, pr.size));
    document.documentElement.style.setProperty("--text-size", SIZES[pr.size] + "px");
    $("sizeDown").disabled = pr.size === 0;
    $("sizeUp").disabled = pr.size === SIZES.length - 1;
  }
  function toggle(key) {
    state.prefs[key] = !state.prefs[key];
    applyPrefs();
    persistQuietly();
    if (key !== "spell") { editor.focus({ preventScroll: true }); requestAnimationFrame(keepCaretInView); }
    else if (document.activeElement !== editor) editor.focus({ preventScroll: true });
  }
  $("focusBtn").onclick = () => toggle("focus");
  $("typeBtn").onclick = () => toggle("typewriter");
  $("spellBtn").onclick = () => toggle("spell");
  $("sizeDown").onclick = () => { state.prefs.size--; applyPrefs(); persistQuietly(); };
  $("sizeUp").onclick = () => { state.prefs.size++; applyPrefs(); persistQuietly(); };

  // ---------- toast ----------
  let toastTimer = 0;
  function toast(msg, actionLabel, action) {
    $("toastMsg").textContent = msg;
    const btn = $("toastAction");
    btn.hidden = !action;
    if (action) { btn.textContent = actionLabel; btn.onclick = () => { action(); hideToast(); }; }
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, action ? 9000 : 3500);
  }
  function hideToast() { $("toast").hidden = true; }

  // ---------- pieces drawer ----------
  function renderList() {
    const list = $("pieceList");
    list.innerHTML = "";
    [...state.pieces].sort((a, b) => b.updated - a.updated).forEach((p) => {
      const li = document.createElement("li");
      li.className = "piece";
      li.setAttribute("aria-current", p.id === state.current);
      const open = document.createElement("button");
      open.className = "piece-open";
      const t = document.createElement("span"); t.className = "t"; t.textContent = titleOfHTML(p.html);
      const m = document.createElement("span"); m.className = "m"; m.textContent = `${plural(p.words || 0, "word")} · ${ago(p.updated)}`;
      open.append(t, m);
      open.onclick = () => { saveNow(); load(p.id); persistQuietly(); closeDrawer(); editor.focus(); placeCaret(editor.lastElementChild, true); };
      const del = document.createElement("button");
      del.className = "piece-del";
      del.textContent = "Delete";
      del.setAttribute("aria-label", `Delete “${t.textContent}”`);
      del.onclick = () => deletePiece(p.id);
      li.append(open, del);
      list.append(li);
    });
  }
  function openDrawer() {
    saveNow();
    wake();
    renderList();
    $("drawer").hidden = false; $("scrim").hidden = false;
    $("drawerBtn").setAttribute("aria-expanded", "true");
    $("newBtn").focus();
  }
  function closeDrawer() {
    $("drawer").hidden = true; $("scrim").hidden = true;
    $("drawerBtn").setAttribute("aria-expanded", "false");
  }
  $("drawerBtn").onclick = () => ($("drawer").hidden ? openDrawer() : closeDrawer());
  $("scrim").onclick = closeDrawer;
  $("newBtn").onclick = () => {
    saveNow();
    const p = newPiece();
    state.pieces.push(p);
    load(p.id);
    persistQuietly();
    closeDrawer();
    editor.focus();
    placeCaret(editor.firstElementChild);
  };
  function deletePiece(id) {
    saveNow();
    const idx = state.pieces.findIndex((p) => p.id === id);
    if (idx < 0) return;
    const [gone] = state.pieces.splice(idx, 1);
    state.today.start -= gone.words || 0;
    const wasCurrent = id === state.current;
    if (!state.pieces.length) state.pieces.push(newPiece());
    if (wasCurrent) load([...state.pieces].sort((a, b) => b.updated - a.updated)[0].id);
    persistQuietly();
    renderList();
    toast(`Deleted “${titleOfHTML(gone.html)}”.`, "Undo", () => {
      state.pieces.splice(Math.min(idx, state.pieces.length), 0, gone);
      state.today.start += gone.words || 0;
      load(gone.id);
      persistQuietly();
      if (!$("drawer").hidden) renderList();
    });
  }

  // ---------- taking your words with you ----------
  function plainText() {
    return [...editor.children].map((c) => c.innerText.trim()).join("\n\n").replace(/\n{3,}/g, "\n\n").trim() + "\n";
  }
  $("copyBtn").onclick = async () => {
    saveNow();
    const html = toHTML(blocksOf(editor));
    const text = plainText();
    try {
      if (window.ClipboardItem && navigator.clipboard && navigator.clipboard.write) {
        await navigator.clipboard.write([new ClipboardItem({
          "text/html": new Blob([html], { type: "text/html" }),
          "text/plain": new Blob([text], { type: "text/plain" }),
        })]);
      } else {
        await navigator.clipboard.writeText(text);
      }
      toast("Copied. Paste it into an email, a doc, anywhere.");
    } catch (e) {
      try { await navigator.clipboard.writeText(text); toast("Copied as plain text."); }
      catch (e2) {
        editor.focus();
        const r = document.createRange(); r.selectNodeContents(editor);
        const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
        toast("Your piece is selected. Press Ctrl+C (⌘C on a Mac) to copy it.");
      }
    }
  };
  let framed = false;
  try { framed = window.self !== window.top; } catch (e) { framed = true; }
  if (framed) $("downloadBtn").hidden = true;
  $("downloadBtn").onclick = () => {
    saveNow();
    const name = (titleOfHTML(piece().html).replace(/[^\p{L}\p{N}]+/gu, " ").trim().slice(0, 50) || "Untitled") + ".txt";
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([plainText()], { type: "text/plain;charset=utf-8" }));
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };

  // ---------- start ----------
  applyPrefs();
  load(state.current);
  persistQuietly();
  $("saveState").textContent = "Saved";
})();
</script>
</body>
</html>
