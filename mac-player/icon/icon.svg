<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- CapsulePlayer app icon. Edit this, then run icon/make_icns.py. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a505a"/>
      <stop offset="0.5" stop-color="#2a2e35"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa3ad"/>
      <stop offset="1" stop-color="#2b2f35"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b120c"/>
      <stop offset="1" stop-color="#030604"/>
    </linearGradient>
    <!-- Bars run green to yellow to red from the bottom of the display up. -->
    <linearGradient id="spectrum" x1="0" y1="640" x2="0" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22c43c"/>
      <stop offset="0.55" stop-color="#7cf04a"/>
      <stop offset="0.8" stop-color="#f2e04a"/>
      <stop offset="1" stop-color="#ff5a3c"/>
    </linearGradient>
    <linearGradient id="capsule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e6e9ed"/>
      <stop offset="1" stop-color="#b9bfc6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="lcdclip"><rect x="200" y="214" width="624" height="452" rx="40"/></clipPath>
  </defs>

  <!-- body -->
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#rim)" filter="url(#shadow)"/>
  <rect x="104" y="104" width="816" height="816" rx="180" fill="url(#body)"/>

  <!-- LCD -->
  <rect x="186" y="200" width="652" height="480" rx="52" fill="#0a0c0e"/>
  <rect x="200" y="214" width="624" height="452" rx="40" fill="url(#lcd)"/>
  <g clip-path="url(#lcdclip)">
    <!-- faint grid lines, like an old LCD -->
    <g stroke="#1a3a1f" stroke-width="3" opacity="0.6">
      <line x1="200" y1="300" x2="824" y2="300"/>
      <line x1="200" y1="380" x2="824" y2="380"/>
      <line x1="200" y1="460" x2="824" y2="460"/>
      <line x1="200" y1="540" x2="824" y2="540"/>
    </g>
    <!-- spectrum bars: x, top -->
    <g fill="url(#spectrum)" filter="url(#glow)">
      <rect x="244" y="470" width="52" height="170" rx="6"/>
      <rect x="312" y="360" width="52" height="280" rx="6"/>
      <rect x="380" y="270" width="52" height="370" rx="6"/>
      <rect x="448" y="330" width="52" height="310" rx="6"/>
      <rect x="516" y="420" width="52" height="220" rx="6"/>
      <rect x="584" y="300" width="52" height="340" rx="6"/>
      <rect x="652" y="400" width="52" height="240" rx="6"/>
      <rect x="720" y="500" width="52" height="140" rx="6"/>
    </g>
    <!-- peak markers -->
    <g fill="#d9ffd0" opacity="0.9">
      <rect x="244" y="440" width="52" height="12" rx="4"/>
      <rect x="312" y="330" width="52" height="12" rx="4"/>
      <rect x="380" y="244" width="52" height="12" rx="4"/>
      <rect x="448" y="300" width="52" height="12" rx="4"/>
      <rect x="516" y="388" width="52" height="12" rx="4"/>
      <rect x="584" y="270" width="52" height="12" rx="4"/>
      <rect x="652" y="370" width="52" height="12" rx="4"/>
      <rect x="720" y="470" width="52" height="12" rx="4"/>
    </g>
    <!-- glass reflection -->
    <path d="M200 214 H824 V360 Q512 300 200 400 Z" fill="url(#gloss)"/>
  </g>

  <!-- the "capsule": a little white Time Capsule with its status light -->
  <rect x="300" y="730" width="424" height="112" rx="56" fill="#0d0f12" opacity="0.55"/>
  <rect x="300" y="720" width="424" height="112" rx="56" fill="url(#capsule)"/>
  <rect x="330" y="732" width="364" height="36" rx="18" fill="#ffffff" opacity="0.55"/>
  <circle cx="512" cy="800" r="13" fill="#3dff5a" filter="url(#glow)"/>

  <!-- top highlight on the body -->
  <path d="M104 284 Q104 104 284 104 H740 Q920 104 920 284 V300 Q512 230 104 300 Z" fill="url(#gloss)"/>
</svg>
