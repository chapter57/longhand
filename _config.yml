# Longhand's website settings.
# GitHub rebuilds the site a minute or two after this file changes.

title: Longhand
description: >-
  Longhand is a free writing app and a literary almanac: a writer, a book or
  a moment from literary history for every day.
season: Autumn 2026

# Where readers write to us.
email: longhandlit@gmail.com

# The almanac's Bluesky account. This address keeps working if the account's
# handle changes.
bluesky: "https://bsky.app/profile/did:plc:fpx4ses6oidyiwqyp4zkl7vq"

# The site's address. The CNAME file next to this one tells GitHub Pages
# to serve the site at this domain.
url: "https://longhandlit.com"
baseurl: ""

# The almanac: one file per day in _almanac/, each with its own page at
# /almanac/<file name>/.
collections:
  almanac:
    output: true
    permalink: /almanac/:title/

defaults:
  - scope:
      type: almanac
    values:
      layout: almanac-entry

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
