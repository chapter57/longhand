# Longhand's website settings.
# GitHub rebuilds the site a minute or two after this file changes.

title: Longhand
tagline: A quiet place to write, read, and talk about both.
description: >-
  Longhand is a free writing app, a small literary journal, and a book club
  for people who care how a sentence sounds.
season: Autumn 2026

# Fill these in to switch on the matching parts of the site.
# Leave one as "" and the site says that part is coming soon.
email: ""                 # where journal submissions and questions go, e.g. "editors@longhand.example"
newsletter_username: ""   # your Buttondown username (buttondown.com), e.g. "longhand"
discussion_url: ""        # the forum's address, "https://forum.longhandlit.com", once it's installed
discussion_name: the Longhand forum  # shown as "Join us on the Longhand forum"

# The site's address. The CNAME file next to this one tells GitHub Pages
# to serve the site at this domain.
url: "https://longhandlit.com"
baseurl: ""

collections:
  journal:
    output: true
    permalink: /journal/:name/

defaults:
  - scope:
      path: ""
      type: journal
    values:
      layout: piece

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
