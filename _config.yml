# Longhand's website settings.
# GitHub rebuilds the site a minute or two after this file changes.

title: Longhand
description: >-
  The Longhand Almanac: a writer, a book or a moment from literary history,
  every day, with the story behind it and somewhere to start reading.
season: Autumn 2026
# The almanac's first day. Entries open one day at a time from here: readers
# see today's and every earlier one, never the days still to come.
almanac_start: "2026-10-17"

# Where readers write to us.
email: hello@longhandlit.com

# The almanac's Bluesky account. This address keeps working if the account's
# handle changes.
bluesky: "https://bsky.app/profile/did:plc:fpx4ses6oidyiwqyp4zkl7vq"
instagram: "https://www.instagram.com/longhandliterature/"

# Review submissions are emailed to the address above through Web3Forms. This
# key only allows sending to that inbox, so it's safe in public.
# GoatCounter visitor counting (no cookies): stats at https://cdamonsmith.goatcounter.com
goatcounter: cdamonsmith
# Bookshop.org affiliate ID: book links on the site earn a small commission.
bookshop_id: "130078"
# The Longhand storefront on Bookshop.org (https://bookshop.org/shop/longhandlit).
# When set, the front page and the Almanac page link to it as "The Almanac Shelf".
bookshop_shop: "https://bookshop.org/shop/longhandlit"
# The weekly newsletter on Substack; its signup box appears on the front page
# and under each almanac entry. Leave empty to hide it.
newsletter: "https://longhandlit.substack.com"
web3forms_key: "7c72d9f4-af8b-4949-98fd-3433f5086676"

# The site's address. The CNAME file next to this one tells GitHub Pages
# to serve the site at this domain.
url: "https://longhandlit.com"
baseurl: ""

# The almanac: one file per day in _almanac/, each with its own page at
# /almanac/<file name>/.
collections:
  almanac:
    output: true
    permalink: /almanac/:title/
  # Readers' reviews of classic books, one file each, added after vetting.
  reviews:
    output: true
    permalink: /reviews/:name/

defaults:
  - scope:
      type: almanac
    values:
      layout: almanac-entry
  - scope:
      type: reviews
    values:
      layout: review

markdown: kramdown
kramdown:
  input: GFM

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
