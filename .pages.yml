# Pages CMS settings: the editing screen at https://app.pagescms.org.
# The almanac is one file per day in _almanac/. Each has its own page.

media:
  input: assets/images/almanac
  output: /assets/images/almanac

content:
  - name: almanac
    label: Almanac calendar
    description: One entry per day. The site shows today's entry on the front page and the coming week on the Almanac page by itself.
    type: collection
    path: _almanac
    filename: "{fields.month}-{fields.day}-{primary}.md"
    view:
      fields: [name, month, day, kind]
      primary: name
    fields:
      - name: month
        label: Month (1–12)
        type: number
        required: true
      - name: day
        label: Day of the month
        type: number
        required: true
      - name: year
        label: Year it happened
        type: number
        required: true
      - name: kind
        label: Kind
        type: select
        default: Born
        options:
          values: [Born, Died, Published, Event]
      - name: name
        label: Name
        description: The writer, or the book or event.
        type: string
        required: true
      - name: note
        label: Note
        description: Two or three sentences. Please check the facts against two sources.
        type: text
        required: true
      - name: wiki
        label: Read more link
        description: Usually the Wikipedia article.
        type: string
      - name: read
        label: Read the work link
        description: A free copy (Project Gutenberg, Poetry Foundation) or a library search (WorldCat).
        type: string
      - name: read_label
        label: Words on that link
        description: For example, "Read his poems free" or "Find it at a library".
        type: string
      - name: buy
        label: Book to buy
        description: The title of the book the bookstore link points to, for example "Moby-Dick".
        type: string
      - name: isbn
        label: The book's ISBN
        description: The 13-digit ISBN (starting 978) of the edition to link to on Bookshop.org. Leave empty for no bookstore link.
        type: string
      - name: portrait
        label: Portrait from Wikipedia
        description: The end of the Wikipedia address for the person to picture, for example "John_Keats". The picture at the top of that article is shown, with its credit. Leave empty for no portrait.
        type: string
      - name: pictured
        label: Who is pictured
        description: Only needed when the entry is a book or an event, for example "Herman Melville".
        type: string
      - name: image
        label: Portrait stored on the site (optional)
        description: Used instead of the Wikipedia portrait. Only use images that are public domain or freely licensed.
        type: image
      - name: image_credit
        label: Portrait credit
        description: Who made the image and its license, for example "Joseph Severn, public domain, via Wikimedia Commons".
        type: string
      - name: body
        label: The full entry
        description: The longer, original piece on the entry's own page.
        type: rich-text
  - name: reviews
    label: Reviews
    description: Readers' reviews of classic books. Add one after you've approved it; it appears on the Reviews page.
    type: collection
    path: _reviews
    filename: "{fields.date}-{primary}.md"
    view:
      fields: [book, reviewer, date]
      primary: book
      sort: [date]
    fields:
      - name: book
        label: Book title
        type: string
        required: true
      - name: book_author
        label: Book author
        type: string
        required: true
      - name: book_year
        label: Year the book was published
        type: string
      - name: reviewer
        label: Reviewer's name
        description: As they asked for it to appear.
        type: string
        required: true
      - name: date
        label: Date published on the site
        type: date
        required: true
      - name: description
        label: One-line summary
        description: Shown in the list of reviews and in links shared on social media.
        type: string
      - name: isbn
        label: The book's ISBN
        description: The 13-digit ISBN (starting 978) of an edition of the book. The page then links to it on Bookshop.org with Longhand's affiliate ID.
        type: string
      - name: read
        label: Read it free link
        description: For public-domain books, a link to a free copy, such as on Project Gutenberg.
        type: string
      - name: body
        label: The review
        type: rich-text
