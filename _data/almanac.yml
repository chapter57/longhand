# The Longhand Almanac: one literary anniversary per day.
# The site picks today's entry and the coming week's by itself.
#
# Each entry:
#   month, day, year   when it happened (the year it happened, not this year)
#   kind               Born, Died, Published or Event
#   name               the writer, or the book or event
#   note               two or three sentences
#   wiki               a link to read more
#   read               a link to read the work (or find it at a library)
#   read_label         the words on that link
#   image              optional: a portrait in assets/images/almanac/
#   image_credit       required with an image: who made it and its license
#
# Dates were checked against at least two sources when written.

# ---------- October ----------

- month: 10
  day: 17
  year: 1711
  kind: Born
  name: Jupiter Hammon
  note: >-
    Born enslaved on Long Island, Hammon became the first published African
    American poet when his broadside "An Evening Thought" appeared around 1760.
    Many people now mark his birthday as Black Poetry Day.
  wiki: https://en.wikipedia.org/wiki/Jupiter_Hammon
  read: https://www.poetryfoundation.org/poets/jupiter-hammon
  read_label: Read his poems

- month: 10
  day: 18
  year: 1785
  kind: Born
  name: Thomas Love Peacock
  note: >-
    Peacock wrote comic novels in which people mostly sit around talking. His
    best loved, Nightmare Abbey (1818), gently mocks the Romantic poets,
    including his close friend Percy Bysshe Shelley, who appears in it
    lightly disguised.
  wiki: https://en.wikipedia.org/wiki/Thomas_Love_Peacock
  read: https://www.gutenberg.org/ebooks/search/?query=Thomas+Love+Peacock
  read_label: Read Nightmare Abbey free

- month: 10
  day: 19
  year: 1605
  kind: Born
  name: Sir Thomas Browne
  note: >-
    A doctor in Norwich, Browne wrote some of the richest prose in English,
    beginning with Religio Medici, his reflections on faith and doubt. He was
    born on October 19, 1605, and died on October 19, 1682: his 77th birthday.
  wiki: https://en.wikipedia.org/wiki/Thomas_Browne
  read: https://www.gutenberg.org/ebooks/search/?query=Thomas+Browne
  read_label: Read his work free

- month: 10
  day: 20
  year: 1854
  kind: Born
  name: Arthur Rimbaud
  note: >-
    Rimbaud wrote the poetry that changed French literature while still a
    teenager, including A Season in Hell (1873). Then, barely into his
    twenties, he stopped writing altogether and went off to work as a trader
    in Africa.
  wiki: https://en.wikipedia.org/wiki/Arthur_Rimbaud
  read: https://www.gutenberg.org/ebooks/search/?query=Rimbaud
  read_label: Read his poems free

- month: 10
  day: 21
  year: 1772
  kind: Born
  name: Samuel Taylor Coleridge
  note: >-
    Coleridge and William Wordsworth published Lyrical Ballads in 1798, opening
    with his "Rime of the Ancient Mariner." He said "Kubla Khan" came to him
    whole in a dream, and that a visitor "from Porlock" interrupted him before
    he could write it all down.
  wiki: https://en.wikipedia.org/wiki/Samuel_Taylor_Coleridge
  read: https://www.gutenberg.org/ebooks/search/?query=Coleridge
  read_label: Read his poems free

- month: 10
  day: 22
  year: 1870
  kind: Born
  name: Ivan Bunin
  note: >-
    In 1933 Bunin became the first Russian writer to win the Nobel Prize in
    Literature. His stories, including "The Gentleman from San Francisco," are
    known for their clear, exact prose. He lived in exile in France from 1920
    until his death.
  wiki: https://en.wikipedia.org/wiki/Ivan_Bunin
  read: https://search.worldcat.org/search?q=Ivan+Bunin
  read_label: Find his stories at a library

- month: 10
  day: 23
  year: 1844
  kind: Born
  name: Robert Bridges
  note: >-
    A doctor who came to poetry late, Bridges served as Britain's Poet
    Laureate from 1913 until his death. His greatest gift to readers may be
    someone else's work: decades after his friend Gerard Manley Hopkins died,
    Bridges brought Hopkins's poems into print.
  wiki: https://en.wikipedia.org/wiki/Robert_Bridges
  read: https://www.gutenberg.org/ebooks/search/?query=Robert+Bridges
  read_label: Read his poems free

- month: 10
  day: 24
  year: 1923
  kind: Born
  name: Denise Levertov
  note: >-
    Born in Ilford, England, Levertov moved to the United States and became
    one of its most admired poets, writing with close attention to the natural
    world. In the 1960s her poems turned toward protest against the Vietnam
    War.
  wiki: https://en.wikipedia.org/wiki/Denise_Levertov
  read: https://www.poetryfoundation.org/poets/denise-levertov
  read_label: Read her poems

- month: 10
  day: 25
  year: 1400
  kind: Died
  name: Geoffrey Chaucer
  note: >-
    This is the traditional date of Chaucer's death, taken from his tomb in
    Westminster Abbey. He left The Canterbury Tales unfinished, and his burial
    in the Abbey began the tradition of what we now call Poets' Corner.
  wiki: https://en.wikipedia.org/wiki/Geoffrey_Chaucer
  read: https://www.gutenberg.org/ebooks/search/?query=Chaucer
  read_label: Read The Canterbury Tales free

- month: 10
  day: 26
  year: 1902
  kind: Born
  name: Beryl Markham
  note: >-
    Raised in Kenya, Markham trained racehorses, flew as a bush pilot, and in
    1936 became the first woman to fly solo across the Atlantic from east to
    west. Her memoir, West with the Night (1942), was nearly forgotten until
    its republication in 1983 made it a classic.
  wiki: https://en.wikipedia.org/wiki/Beryl_Markham
  read: https://search.worldcat.org/search?q=West+with+the+Night
  read_label: Find it at a library

- month: 10
  day: 27
  year: 1914
  kind: Born
  name: Dylan Thomas
  note: >-
    The Welsh poet of "Do not go gentle into that good night" and the radio
    play Under Milk Wood was born in Swansea. Sylvia Plath was born on the
    same day eighteen years later.
  wiki: https://en.wikipedia.org/wiki/Dylan_Thomas
  read: https://search.worldcat.org/search?q=Dylan+Thomas+collected+poems
  read_label: Find his poems at a library

- month: 10
  day: 28
  year: 1726
  kind: Published
  name: Gulliver's Travels
  note: >-
    Jonathan Swift's satire came out in London without his name on it,
    presented as the true memoir of a ship's surgeon named Lemuel Gulliver. It
    was an immediate success.
  wiki: https://en.wikipedia.org/wiki/Gulliver%27s_Travels
  read: https://www.gutenberg.org/ebooks/search/?query=Gulliver%27s+Travels
  read_label: Read it free

- month: 10
  day: 29
  year: 1740
  kind: Born
  name: James Boswell
  note: >-
    Boswell met Samuel Johnson in a London bookshop in 1763 and spent much of
    the next two decades recording Johnson's conversation. The result, The
    Life of Samuel Johnson (1791), is often called the greatest biography in
    English.
  wiki: https://en.wikipedia.org/wiki/James_Boswell
  read: https://www.gutenberg.org/ebooks/search/?query=Boswell+Life+of+Johnson
  read_label: Read it free

- month: 10
  day: 30
  year: 1871
  kind: Born
  name: Paul Valéry
  note: >-
    Born in the French port town of Sète, Valéry wrote poems as a young man,
    then largely stepped away from poetry for about twenty years. He came back
    with La Jeune Parque (1917) and "Le Cimetière marin," a long meditation
    set in the seaside cemetery of his hometown, where he is buried.
  wiki: https://en.wikipedia.org/wiki/Paul_Val%C3%A9ry
  read: https://search.worldcat.org/search?q=Paul+Val%C3%A9ry+poems
  read_label: Find his poems at a library

- month: 10
  day: 31
  year: 1795
  kind: Born
  name: John Keats
  note: >-
    Keats wrote his great odes, to a nightingale, to autumn and on a Grecian
    urn, mostly in 1819. Two years later he died of tuberculosis in Rome at 25,
    asking that his gravestone carry no name, only the words "Here lies one
    whose name was writ in water."
  wiki: https://en.wikipedia.org/wiki/John_Keats
  read: https://www.gutenberg.org/ebooks/search/?query=Keats
  read_label: Read his poems free

# ---------- November ----------

- month: 11
  day: 1
  year: 1871
  kind: Born
  name: Stephen Crane
  note: >-
    Crane had never seen a battle when he wrote The Red Badge of Courage
    (1895), the Civil War novel that made him famous. He packed a whole career
    of fiction, poetry and journalism into a short life, dying at 28.
  wiki: https://en.wikipedia.org/wiki/Stephen_Crane
  read: https://www.gutenberg.org/ebooks/search/?query=Stephen+Crane
  read_label: Read his work free

- month: 11
  day: 2
  year: 1960
  kind: Event
  name: Lady Chatterley's Lover goes free
  note: >-
    After a two-week trial at the Old Bailey, a jury found Penguin Books not
    guilty of obscenity for publishing D. H. Lawrence's novel in full. Writers
    including E. M. Forster testified for the defense, and the verdict opened
    the way for far freer publishing in Britain.
  wiki: https://en.wikipedia.org/wiki/R_v_Penguin_Books_Ltd
  read: https://www.gutenberg.org/ebooks/search/?query=Lady+Chatterley
  read_label: Read the novel free

- month: 11
  day: 3
  year: 1794
  kind: Born
  name: William Cullen Bryant
  note: >-
    Bryant began "Thanatopsis," his meditation on death, as a teenager, and
    its publication in 1817 made his name as a poet. He went on to edit the
    New York Evening Post for about half a century.
  wiki: https://en.wikipedia.org/wiki/William_Cullen_Bryant
  read: https://www.gutenberg.org/ebooks/search/?query=William+Cullen+Bryant
  read_label: Read his poems free

- month: 11
  day: 4
  year: 1918
  kind: Died
  name: Wilfred Owen
  note: >-
    Owen was killed leading his men across the Sambre–Oise Canal in France,
    one week before the Armistice. His parents received the telegram on
    Armistice Day. Only a handful of his poems were published in his lifetime;
    "Dulce et Decorum Est" and the rest came after.
  wiki: https://en.wikipedia.org/wiki/Wilfred_Owen
  read: https://www.gutenberg.org/ebooks/search/?query=Wilfred+Owen
  read_label: Read his poems free

- month: 11
  day: 5
  year: 1857
  kind: Born
  name: Ida Tarbell
  note: >-
    Tarbell's History of the Standard Oil Company, first published in
    installments from 1902 to 1904, exposed how John D. Rockefeller built his
    monopoly. It is a founding work of investigative journalism.
  wiki: https://en.wikipedia.org/wiki/Ida_Tarbell
  read: https://www.gutenberg.org/ebooks/search/?query=Ida+Tarbell
  read_label: Read it free

- month: 11
  day: 6
  year: 1880
  kind: Born
  name: Robert Musil
  note: >-
    The Austrian novelist spent the last two decades of his life on The Man
    Without Qualities, a vast portrait of Vienna just before the First World
    War. He was still revising it on the morning he died, and it remains
    unfinished.
  wiki: https://en.wikipedia.org/wiki/Robert_Musil
  read: https://search.worldcat.org/search?q=The+Man+Without+Qualities
  read_label: Find it at a library

- month: 11
  day: 7
  year: 1913
  kind: Born
  name: Albert Camus
  note: >-
    Born in French Algeria, Camus wrote The Stranger (1942) and The Plague
    (1947) and won the Nobel Prize in Literature in 1957, at just 44. He died
    in a car accident three years later.
  wiki: https://en.wikipedia.org/wiki/Albert_Camus
  read: https://search.worldcat.org/search?q=Albert+Camus+The+Stranger
  read_label: Find it at a library

- month: 11
  day: 8
  year: 1847
  kind: Born
  name: Bram Stoker
  note: >-
    For most of his working life Stoker managed London's Lyceum Theatre for
    the actor Henry Irving, and wrote in his spare time. One of those spare-time
    books was Dracula (1897).
  wiki: https://en.wikipedia.org/wiki/Bram_Stoker
  read: https://www.gutenberg.org/ebooks/search/?query=Dracula
  read_label: Read Dracula free

- month: 11
  day: 9
  year: 1818
  kind: Born
  name: Ivan Turgenev
  note: >-
    Turgenev's A Sportsman's Sketches quietly showed readers the lives of
    Russia's serfs, and Fathers and Sons (1862) made famous a word for a
    restless young generation: nihilist.
  wiki: https://en.wikipedia.org/wiki/Ivan_Turgenev
  read: https://www.gutenberg.org/ebooks/search/?query=Turgenev
  read_label: Read his work free

- month: 11
  day: 10
  year: 1759
  kind: Born
  name: Friedrich Schiller
  note: >-
    The German poet and playwright wrote "Ode to Joy" in 1785. Almost forty
    years later, Beethoven set it in the final movement of his Ninth Symphony,
    which is how most of the world knows it today.
  wiki: https://en.wikipedia.org/wiki/Friedrich_Schiller
  read: https://www.gutenberg.org/ebooks/search/?query=Schiller
  read_label: Read his work free

- month: 11
  day: 11
  year: 1821
  kind: Born
  name: Fyodor Dostoevsky
  note: >-
    In 1849 Dostoevsky was led out to be shot with other political prisoners,
    only for a pardon to arrive at the last moment. He spent the next years in
    a Siberian prison camp, and that brush with death runs through Crime and
    Punishment and everything after.
  wiki: https://en.wikipedia.org/wiki/Fyodor_Dostoevsky
  read: https://www.gutenberg.org/ebooks/search/?query=Dostoevsky
  read_label: Read his novels free

- month: 11
  day: 12
  year: 1929
  kind: Born
  name: Michael Ende
  note: >-
    The son of a surrealist painter, Ende wrote Momo and The Neverending
    Story (1979), a novel about a boy who finds himself inside the book he is
    reading. His books have sold tens of millions of copies around the world.
  wiki: https://en.wikipedia.org/wiki/Michael_Ende
  read: https://search.worldcat.org/search?q=The+Neverending+Story+Ende
  read_label: Find it at a library

- month: 11
  day: 13
  year: 1850
  kind: Born
  name: Robert Louis Stevenson
  note: >-
    Born in Edinburgh, Stevenson gave us Treasure Island (1883) and Strange
    Case of Dr Jekyll and Mr Hyde (1886). He spent his last years in Samoa,
    where he died in 1894.
  wiki: https://en.wikipedia.org/wiki/Robert_Louis_Stevenson
  read: https://www.gutenberg.org/ebooks/search/?query=Robert+Louis+Stevenson
  read_label: Read his books free

- month: 11
  day: 14
  year: 1851
  kind: Published
  name: Moby-Dick
  note: >-
    Herman Melville's novel came out in New York as Moby-Dick, a month after
    a shortened London edition appeared under the title The Whale. It was
    dedicated to Nathaniel Hawthorne, and it sold poorly for the rest of
    Melville's life.
  wiki: https://en.wikipedia.org/wiki/Moby-Dick
  read: https://www.gutenberg.org/ebooks/search/?query=Moby+Dick
  read_label: Read it free

- month: 11
  day: 15
  year: 1887
  kind: Born
  name: Marianne Moore
  note: >-
    Moore's poems are precise, witty and full of animals. Her best-known poem,
    "Poetry," begins "I, too, dislike it." She edited the influential magazine
    The Dial in the 1920s.
  wiki: https://en.wikipedia.org/wiki/Marianne_Moore
  read: https://www.poetryfoundation.org/poets/marianne-moore
  read_label: Read her poems

- month: 11
  day: 16
  year: 1930
  kind: Born
  name: Chinua Achebe
  note: >-
    Achebe's first novel, Things Fall Apart (1958), told the story of
    colonialism from inside an Igbo village. It became one of the most widely
    read novels written in Africa, and took its title from a line by W. B.
    Yeats.
  wiki: https://en.wikipedia.org/wiki/Chinua_Achebe
  read: https://search.worldcat.org/search?q=Things+Fall+Apart+Achebe
  read_label: Find it at a library

- month: 11
  day: 17
  year: 1587
  kind: Born
  name: Joost van den Vondel
  note: >-
    The greatest poet of the Dutch Golden Age was born in Cologne and earned
    his living for years as a stocking merchant in Amsterdam. His play
    Gijsbrecht van Aemstel opened Amsterdam's first city theatre in 1638, and
    was staged there every New Year for more than three centuries.
  wiki: https://en.wikipedia.org/wiki/Joost_van_den_Vondel
  read: https://search.worldcat.org/search?q=Joost+van+den+Vondel
  read_label: Find his work at a library

- month: 11
  day: 18
  year: 1939
  kind: Born
  name: Margaret Atwood
  note: >-
    Born in Ottawa, Atwood has written poetry, criticism and more than a dozen
    novels, including The Handmaid's Tale (1985). She has won the Booker Prize
    twice.
  wiki: https://en.wikipedia.org/wiki/Margaret_Atwood
  read: https://search.worldcat.org/search?q=Margaret+Atwood
  read_label: Find her books at a library

- month: 11
  day: 19
  year: 1863
  kind: Event
  name: The Gettysburg Address
  note: >-
    At the dedication of a cemetery for the Union dead, the main speaker
    talked for about two hours. Abraham Lincoln followed with fewer than three
    hundred words and took about two minutes, and it's his speech that is
    remembered.
  wiki: https://en.wikipedia.org/wiki/Gettysburg_Address
  read: https://www.gutenberg.org/ebooks/search/?query=Gettysburg+Address
  read_label: Read it free

- month: 11
  day: 20
  year: 1858
  kind: Born
  name: Selma Lagerlöf
  note: >-
    In 1909 the Swedish novelist became the first woman to win the Nobel Prize
    in Literature. She wrote The Wonderful Adventures of Nils, about a boy who
    crosses Sweden on the back of a goose, and used her prize money to buy
    back Mårbacka, the family estate where she grew up.
  wiki: https://en.wikipedia.org/wiki/Selma_Lagerl%C3%B6f
  read: https://www.gutenberg.org/ebooks/search/?query=Lagerl%C3%B6f
  read_label: Read her books free

- month: 11
  day: 21
  year: 1694
  kind: Born
  name: Voltaire
  note: >-
    Born François-Marie Arouet in Paris, Voltaire wrote plays, histories,
    poems and thousands of letters, and was jailed and exiled for his wit. His
    short satirical novel Candide (1759) is still his most read.
  wiki: https://en.wikipedia.org/wiki/Voltaire
  read: https://www.gutenberg.org/ebooks/search/?query=Candide
  read_label: Read Candide free

- month: 11
  day: 22
  year: 1819
  kind: Born
  name: George Eliot
  note: >-
    Mary Ann Evans chose a man's name so her novels would be taken seriously.
    The one most often called the greatest novel in English is Middlemarch
    (1871–72), her portrait of a provincial town.
  wiki: https://en.wikipedia.org/wiki/George_Eliot
  read: https://www.gutenberg.org/ebooks/search/?query=George+Eliot
  read_label: Read her novels free

- month: 11
  day: 23
  year: 1920
  kind: Born
  name: Paul Celan
  note: >-
    Born Paul Antschel in Czernowitz, Celan survived the Holocaust, in which
    both his parents were killed. He chose to write in German, the language of
    his mother and of her murderers, and his poem "Todesfuge" (Death Fugue)
    became one of the century's most important.
  wiki: https://en.wikipedia.org/wiki/Paul_Celan
  read: https://search.worldcat.org/search?q=Paul+Celan+poems
  read_label: Find his poems at a library

- month: 11
  day: 24
  year: 1826
  kind: Born
  name: Carlo Collodi
  note: >-
    Carlo Lorenzini took his pen name from his mother's home village of
    Collodi in Tuscany. In 1881 he began a serial for a children's magazine
    about a wooden puppet who wants to be a real boy: Pinocchio.
  wiki: https://en.wikipedia.org/wiki/Carlo_Collodi
  read: https://www.gutenberg.org/ebooks/search/?query=Pinocchio
  read_label: Read Pinocchio free

- month: 11
  day: 25
  year: 1562
  kind: Born
  name: Lope de Vega
  note: >-
    Spain's great playwright is credited with writing well over a thousand
    plays, of which several hundred survive. His best known, Fuenteovejuna,
    tells of a village that rises against a tyrant and answers every question
    with the name of the town.
  wiki: https://en.wikipedia.org/wiki/Lope_de_Vega
  read: https://www.gutenberg.org/ebooks/search/?query=Lope+de+Vega
  read_label: Read his work free

- month: 11
  day: 26
  year: 1865
  kind: Published
  name: Alice's Adventures in Wonderland
  note: >-
    Lewis Carroll's story began as one he made up for Alice Liddell and her
    sisters on a boat trip. Macmillan published it with John Tenniel's
    drawings, though Tenniel disliked the printing so much that the first run
    was withdrawn and reprinted.
  wiki: https://en.wikipedia.org/wiki/Alice%27s_Adventures_in_Wonderland
  read: https://www.gutenberg.org/ebooks/search/?query=Alice%27s+Adventures+in+Wonderland
  read_label: Read it free

- month: 11
  day: 27
  year: 1909
  kind: Born
  name: James Agee
  note: >-
    Agee wrote film criticism, screenplays and Let Us Now Praise Famous Men,
    with photographs by Walker Evans, about tenant farmers in Alabama. His
    novel A Death in the Family, unfinished when he died in 1955, won the
    Pulitzer Prize after his death.
  wiki: https://en.wikipedia.org/wiki/James_Agee
  read: https://search.worldcat.org/search?q=A+Death+in+the+Family+Agee
  read_label: Find it at a library

- month: 11
  day: 28
  year: 1757
  kind: Born
  name: William Blake
  note: >-
    Poet, painter and engraver, Blake printed and hand-colored his own books,
    including Songs of Innocence and of Experience. He was little known when
    he died; "The Tyger" and "London" are now among the best-known poems in
    English.
  wiki: https://en.wikipedia.org/wiki/William_Blake
  read: https://www.gutenberg.org/ebooks/search/?query=William+Blake
  read_label: Read his poems free

- month: 11
  day: 29
  year: 1832
  kind: Born
  name: Louisa May Alcott
  note: >-
    Alcott nursed soldiers during the Civil War and wrote about it in Hospital
    Sketches before writing Little Women (1868), drawn from her life with her
    three sisters.
  wiki: https://en.wikipedia.org/wiki/Louisa_May_Alcott
  read: https://www.gutenberg.org/ebooks/search/?query=Louisa+May+Alcott
  read_label: Read her books free

- month: 11
  day: 30
  year: 1835
  kind: Born
  name: Mark Twain
  note: >-
    Samuel Clemens was born shortly after Halley's Comet passed, and predicted
    he would "go out with it." He died in 1910, the day after the comet's
    return passed closest to the sun, having written Adventures of Huckleberry
    Finn along the way.
  wiki: https://en.wikipedia.org/wiki/Mark_Twain
  read: https://www.gutenberg.org/ebooks/search/?query=Mark+Twain
  read_label: Read his books free
