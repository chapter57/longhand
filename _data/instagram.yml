- id: keats-negative-capability
  caption: |
    In a letter to his brothers in December 1817, John Keats named what he thought great writers share. He called it Negative Capability: being "capable of being in uncertainties, Mysteries, doubts, without any irritable reaching after fact & reason."

    He was 22. Worth practicing.

