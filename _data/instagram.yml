- id: frankenstein-diodati
  caption: |
    June 1816. A cold, rainy summer on Lake Geneva. Lord Byron challenges his guests: "We will each write a ghost story." Days later, eighteen-year-old Mary Godwin (soon Mary Shelley) lies awake and sees "the pale student of unhallowed arts kneeling beside the thing he had put together."

    Frankenstein came out on January 1, 1818. It has never been out of print.

    Both quotes are from her introduction to the 1831 edition. The almanac is at the link in our bio.

    #Frankenstein #MaryShelley #Halloween #GothicLiterature #ClassicBooks #Bookstagram #SpookySeason
  slides:
    - kind: text
      title: June 1816, Lake Geneva.
      body: The summer was so cold and wet that it was called the year without a summer. Lord Byron, the poet Percy Shelley and eighteen-year-old Mary Godwin were stuck indoors at the Villa Diodati, reading ghost stories aloud.
    - kind: quote
      text: "We will each write a ghost story."
      by: Lord Byron, as Mary Shelley remembered it · 1831
    - kind: text
      title: For days, she had nothing.
      body: Then, one night, after the others had talked until past midnight about whether life could be made, she lay in bed with her eyes shut and couldn't sleep.
    - kind: quote
      text: "I saw the pale student of unhallowed arts kneeling beside the thing he had put together."
      by: Mary Shelley, introduction to Frankenstein · 1831
    - kind: text
      title: She was eighteen.
      body: Frankenstein; or, The Modern Prometheus came out on January 1, 1818, with no name on it. Byron soon gave up on his ghost story. Hers is often called the first science fiction novel.
    - kind: end

