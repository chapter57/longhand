      n: "3 of 5"
      title: Lunch Poems
      by: Frank O'Hara · 1964
      body: Poems written on his lunch hour from the Museum of Modern Art, walking around midtown Manhattan.
    - kind: book
      n: "4 of 5"
      title: Revolutionary Letters
      by: Diane di Prima · 1971
      body: Poems written as plain instructions for surviving, and changing, the world. Still in print, and still growing.
