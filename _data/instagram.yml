- id: friday-shelf-beats
  slides:
    - kind: shelf
      title: The Friday Shelf
      sub: Five books to start the Beats, and what came after them.
    - kind: book
      n: "1 of 5"
      title: Howl and Other Poems
      by: Allen Ginsberg · 1956
      body: The little black-and-white book that went on trial for obscenity in 1957, and won.
    - kind: book
      n: "2 of 5"
      title: On the Road
      by: Jack Kerouac · 1957
      body: Typed in about three weeks in 1951 on one long scroll of paper, around 120 feet of it.
    - kind: book
      n: "3 of 5"
      title: Lunch Poems
      by: Frank O'Hara · 1964
      body: Poems written on his lunch hour from the Museum of Modern Art, walking around midtown Manhattan.
    - kind: book
      n: "4 of 5"
      title: Revolutionary Letters
      by: Diane di Prima · 1971
      body: Poems written as plain instructions for surviving, and changing, the world. Still in print, and still growing.
    - kind: book
      n: "5 of 5"
      title: My Life
      by: Lyn Hejinian · 1980
      body: An autobiography in sentences, from the Language poets. The first edition had 37 sections of 37 sentences, written when she was 37.
    - kind: end
      lines:
        - All five are on our Bookshop.org shelf
        - The link is in our bio
        - Bookshop.org shares its profits with independent bookstores
  caption: |
    The Friday Shelf 📚 Five books to start the Beats, and what came after them: Ginsberg, Kerouac, Frank O'Hara, Diane di Prima and Lyn Hejinian.

