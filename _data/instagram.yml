- id: 10-20-rimbaud
  slides:
    - kind: cover
      portrait: 10-20
      kicker: Born today in 1854
      title: He quit poetry at 21.
      sub: By then he had already changed it forever.
    - kind: text
      title: A teenage genius
      body: Arthur Rimbaud grew up in Charleville, in northern France. At sixteen he wrote "The Drunken Boat," one of the most famous poems in French, without ever having seen the sea.
    - kind: text
      title: Paris, and Verlaine
      body: In 1871 the poet Paul Verlaine invited him to Paris. Their wild, stormy affair ended in Brussels in 1873, when Verlaine shot him in the wrist.
    - kind: quote
      text: For I is someone else.
      by: Arthur Rimbaud, letter of 1871 (translated for Longhand)
    - kind: text
      title: Then he walked away.
      body: By about twenty he had stopped writing. He became a trader in East Africa, dealing in coffee and guns, and never wrote another poem. He died in Marseille at 37.
    - kind: end
  caption: |
    Arthur Rimbaud was born on this day in 1854. He wrote all his poetry before he turned 21, changed French poetry forever, and then walked away to trade coffee and guns in East Africa. 🖋️

    Swipe through ➡️

