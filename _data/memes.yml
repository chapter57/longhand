# The almanac's memes, one afternoon post on Bluesky and Instagram for the
# days that have one. The pictures are assets/memes/<month>-<day>.jpg, drawn
# by .github/memes/memes.mjs; the photos in them are public-domain portraits.
#
#   caption  the post's words
#   alt      what the picture shows, for people who can't see it

- month: 10
  day: 19
  caption: "Sir Thomas Browne wrote a whole book about burial urns and how we face death. Then he died on his 77th birthday."
  alt: "Homemade meme. 'me: writes an entire book about urns and dying' over a portrait of Sir Thomas Browne in a doodled pink party hat, with 'horn noise'. 'also me, on my 77th birthday:' and a skull."

- month: 10
  day: 20
  caption: "Arthur Rimbaud reinvented French poetry as a teenager, then quit for good and went into the coffee trade in East Africa."
  alt: "Homemade meme. 'arthur rimbaud's career arc.' Left: a photo of the young Rimbaud, 'age 17: reinvents poetry'. Right: a doodled coffee mug with Rimbaud's face on it, 'age 21: \"im in coffee now\"'."

- month: 10
  day: 21
  caption: "Jack Kerouac taped sheets of paper into one long roll so he'd never have to stop and change the page. On the Road took him about three weeks."
  alt: "Homemade meme. 'every other writer: *puts in a new page*' / 'jack kerouac, 1951:' over a doodled typewriter with a long scroll of paper running off the edge, labeled '120 FEET'. '(he wrote On the Road in 3 weeks)'"

- month: 10
  day: 23
  caption: "Philip Lamantia, born on this day in 1927, was publishing in a New York Surrealist magazine at fifteen."
  alt: "Homemade meme. 'me at 15: *gets my learner's permit*' / 'philip lamantia at 15: *gets his poems published by the new york surrealists*' over a doodled melting clock and a staring eye. '(he grew up to read at the six gallery with ginsberg)'"

- month: 10
  day: 24
  caption: "Denise Levertov never went to school. At twelve she mailed her poems to T. S. Eliot, and he wrote back. Born on this day in 1923."
  alt: "Homemade meme. 'me at 12: *does homework*' / 'denise levertov at 12:' over a doodled envelope addressed to T. S. Eliot, London, with an arrow saying 'mails them' / 'T. S. Eliot: *actually writes back with pages of advice*'"

- month: 10
  day: 25
  caption: "Chaucer planned about 120 Canterbury Tales. He finished 24. He died on this day in 1400, and honestly, relatable."
  alt: "Homemade meme. 'chaucer's plan: 30 pilgrims tell 4 tales each.' Left, 'the plan': a tall stack of books labeled 120. Right, 'what he finished': a portrait of Chaucer above two books labeled 24."

- month: 10
  day: 26
  caption: "Beryl Markham, born on this day in 1902, flew alone across the Atlantic against the wind, then ran out of fuel and landed nose-first in a bog. Then she wrote one of the best memoirs ever."
  alt: "Homemade meme. 'beryl markham: first woman to fly solo across the atlantic from east to west.' A photo of Markham, smiling. 'the landing:' a doodled plane nose-down in brown mud, 'SPLAT', '(a bog in nova scotia)'."

- month: 10
  day: 27
  caption: "Dylan Thomas and Sylvia Plath share a birthday, eighteen years apart. Imagine the party."
  alt: "Homemade meme. 'october 27 is the birthday of dylan thomas AND sylvia plath. the birthday party:' Dylan Thomas, smoking, in a doodled pink party hat, next to a rain cloud pouring on a birthday cake. '(the candles won't stay lit)'"

- month: 10
  day: 28
  caption: "Gulliver's Travels came out on this day in 1726, presented as a true story. Swift told his friend Alexander Pope about one bishop's verdict."
  alt: "Homemade meme. 'jonathan swift: writes a book about tiny people, giants, a flying island and talking horses.' A portrait of Swift. 'an irish bishop, 1726: \"he hardly believed a word of it\"' (Swift, letter to Pope)."

- month: 10
  day: 29
  caption: "James Boswell, born on this day in 1740, spent twenty years writing down everything Samuel Johnson said. The result is still the most famous biography in English."
  alt: "Homemade meme. 'nobody:' / 'james boswell, 1763–1784: *follows samuel johnson around writing down everything he says*'. A portrait of Boswell beside a doodled notebook and pencil, labeled 'the original stan account'."

- month: 10
  day: 30
  caption: "Paul Valéry, born on this day in 1871, gave up poetry in his twenties. A quarter of a century later he came back with a 512-line poem."
  alt: "Homemade meme. 'paul valéry's poetry career.' Left: a photo of Valéry, 'age 21: quits poetry'. Right: a doodled long page labeled '512 lines', '25 years later: \"ok, one more poem\"'."

- month: 10
  day: 31
  caption: "John Keats was born on Halloween, 1795. He asked for no name on his grave. His friends had other ideas."
  alt: "Homemade meme. 'keats: put no name on my grave, just \"here lies one whose name was writ in water\". his friends:' A portrait of Keats beside a doodled gravestone covered in lines of text, '*adds a whole paragraph about how mean the critics were*'. '(the grave still has no name on it. technically.)'"

# Memes about books in general, not tied to a day. Post one by hand: Actions →
# Post the almanac → Run workflow, choose "meme" and type its id. They link
# to the front page. Those marked "pool: true" also fill the afternoon post,
# in rotation, on days that have no meme of their own.

- id: well-read-quadrant
  pool: true
  height: 1350
  caption: "Be honest: which corner are you in?"
  alt: "Homemade chart: 'How well-read you are vs. how well-read you look.' Actually well-read but looks unread: a guy in a cap with a library card owing $0.40, cracked Penguin paperbacks, drugstore glasses, 61 books read this year. Actually well-read and looks it: reads Proust in French for fun, pencil notes in every margin, owns the whole Loeb Classical Library, has read Ulysses twice. Looks unread and is: 9 hours 41 minutes of screen time, a 0 of 52 reading challenge, 'i watched the movie', last book assigned in 2011. Looks well-read but isn't: a guy in sunglasses with Infinite Jest bookmarked on page 12, shelves sorted by color, a literary magazine tote bag, 312 unread books on his Kindle."

- id: reader-iq-curve
  pool: true
  height: 1350
  caption: "The porch guy was right."
  alt: "Homemade IQ-curve meme, 'The Reader IQ Curve.' Low IQ, a smiling doodle holding a book: 'The book was good. I liked it.' Midwit, a crying doodle in a beanie: 'YOU CAN'T JUST ENJOY A BOOK,' with lines like 'The author is dead, actually' and 'Hasn't finished a novel since 2019.' High IQ, Joshua Reynolds's portrait of Samuel Johnson: 'The book was good. I liked it,' and Johnson's 1757 line, 'The only end of writing is to enable the readers better to enjoy life, or better to endure it.'"

- id: unmask-russian-novel
  pool: true
  caption: "Every single time."
  alt: "Homemade unmasking meme. Top: a doodled guy pulls the sheet off a tied-up ghost labeled 'THE GREAT RUSSIAN NOVEL.' Bottom: underneath is Dostoevsky, labeled 'A GUY IN ST. PETERSBURG WHO HASN'T SLEPT IN FOUR DAYS.'"

- id: unmask-great-american-novel
  pool: true
  caption: "Old sport, we've figured it out."
  alt: "Homemade unmasking meme. Top: a doodled guy pulls the sheet off a tied-up ghost labeled 'THE GREAT AMERICAN NOVEL.' Bottom: underneath is F. Scott Fitzgerald, labeled 'A GUY STARING AT A GREEN LIGHT ACROSS THE WATER.'"

- id: unmask-literary-fiction
  pool: true
  caption: "We've read this one. We've read all of them."
  alt: "Homemade unmasking meme. Top: a doodled guy pulls the sheet off a tied-up ghost labeled 'LITERARY FICTION.' Bottom: underneath is a bald doodled man in glasses and a tweed beard, labeled 'A PROFESSOR IN CONNECTICUT HAVING AN AFFAIR.'"

# Halloween.

- id: literary-costumes
  height: 1350
  caption: "Last-minute literary Halloween costumes, ranked by how much effort they take. The Invisible Man is the move."
  alt: "Homemade chart, 'literary halloween costumes, ranked by effort,' from least to most. Bartleby (Melville, 1853): wear your work clothes; whenever anyone asks you to do anything, 'I would prefer not to.' Gregor Samsa (Kafka, 1915): lie on your back on the floor and wave your arms a little; your family will stop visiting. The Invisible Man (H. G. Wells, 1897): don't come. Mrs. Dalloway (Woolf, 1925): go buy the flowers yourself. Miss Havisham (Dickens, 1861): your old wedding dress, one shoe, stop every clock at twenty to nine and stay like that for decades. Captain Ahab (Melville, 1851): one leg made of whalebone; yell about a whale until the party asks you to leave; do not leave."

- id: frankenstein-iq-curve
  height: 1350
  caption: "Every Halloween, the same argument. Every Halloween, the guy on the bottom wins."
  alt: "Homemade IQ-curve meme, 'The Frankenstein IQ Curve.' Low IQ, a grinning doodle with a jack-o'-lantern: 'Frankenstein is the monster.' Midwit, a crying doodle in a beanie: 'ACTUALLY, FRANKENSTEIN IS THE DOCTOR,' with lines like 'The creature doesn't even have a name' and 'Says this at every Halloween party.' High IQ, a calm doodle of the stitched creature: 'Frankenstein is the monster. Victor makes a life, then runs from it. Abandons it. Lies. Lets others hang for it. The name was on the right one all along.'"

- id: unmask-raven
  caption: "Quoth the raven: the one word he knows."
  alt: "Homemade unmasking meme. Top: a doodled guy pulls the sheet off a tied-up ghost labeled 'THE RAVEN'S DEEP SUPERNATURAL MEANING.' Bottom: underneath is a black bird saying 'nevermore,' labeled 'A BIRD THAT KNOWS ONE WORD.'"

- id: dracula-bed
  caption: "Dracula has no servants. In the book he drives the coach, serves Jonathan Harker's dinner, and Harker catches him making the bed. Terror of the Carpathians, fully self-employed."
  alt: "Homemade two-panel meme. Left, a doodled vampire: 'count dracula: undead nobleman, master of wolves, terror of the carpathians.' Right, the same vampire making a bed: 'also count dracula: *makes the guest's bed himself, serves him dinner, drives the coach*' and '(this is really in the book. no servants. he does everything himself.)' Bram Stoker, 1897."

# New formats (a character sheet, a forum post, a starter pack, an alignment
# chart, a tier list), drawn from scratch.

- id: usher-listing
  height: 1350
  caption: "Just listed: charming ancestral home with original features. Some structural notes. Happy Halloween from Poe's \"The Fall of the House of Usher\" (1839). 🏚️"
  alt: "Homemade real-estate listing on a site called home-finder: a doodled gloomy grey manor with green-lit windows, a crack running down its front, and crows overhead, tagged 'New listing, motivated seller.' '$0 (family must go). 3 bd, 1 crypt, 1 tarn, 1 crack. The House of Usher, somewhere dreary, est. many centuries. Ancestral home with original features: vacant eye-like windows, a black and lurid tarn, and a barely perceptible fissure running zigzag from the roof down into the water. Owner (hypersensitive, plays guitar) seeks quiet buyer. Sister in the vault. Probably.' In red: 'Listing status: sank into the tarn, 1839.'"

- id: gothic-candy
  height: 1350
  caption: "Gothic classics as Halloween candy, ranked. Happy Halloween! 🎃 What did you get in your pillowcase?"
  alt: "Homemade tier list, 'gothic classics as Halloween candy.' S: Dracula (1897), the full-size candy bar; everyone remembers which house. A: Frankenstein (1818), the homemade popcorn ball; assembled from parts; your parents warned you; it's great. A: Sleepy Hollow (1820), the plastic pumpkin pail; comes with a head. B: Jekyll and Hyde (1886), the two-flavor lollipop; one side is fine. C: 'The Raven' (1845), candy corn; says the same thing over and over; people have opinions. D: The Turn of the Screw (1898), the unwrapped mystery candy; was it ever real? F: The Castle of Otranto (1764), raisins; technically first; no one is excited. 'What did you get in your pillowcase?'"

- id: holmes-stats
  pool: true
  height: 1350
  caption: "Sherlock Holmes, character select. In A Study in Scarlet, Watson really does write up a list of what Holmes knows: Chemistry, profound. Literature, nil. Astronomy, nil. When Watson tells him the earth goes round the sun, Holmes says he'll try to forget it."
  alt: "Homemade video-game character sheet: 'Character select: Sherlock Holmes. Class: consulting detective, level 99, 221B,' with a doodle of Holmes in a deerstalker and pipe. Stat bars: chemistry, profound; sensational literature, knows every horror of the century; boxing and swords, expert; violin, plays well; British law, good, practical; botany, poisons yes, gardening no; politics, feeble; literature, nil; philosophy, nil; astronomy, nil, learns the earth goes round the sun. A sticker: 'Now that I do know it I shall do my best to forget it.' A Study in Scarlet, 1887."

- id: ahab-aita
  pool: true
  height: 1350
  caption: "Captain Ahab would like the internet's opinion. (Starbuck's comment is nearly word for word from Moby-Dick. So is the bit about the sun.)"
  alt: "Homemade forum post, 'r/AITA, posted by u/OneLegCaptain, 1851': 'AITA for nailing a gold coin to the mast and making my whole crew chase the one whale that took my leg? The crew signed on to hunt whales for oil and money. I've decided we're hunting one whale, specifically, forever. My first mate keeps calling it madness. For the record: I'd strike the sun if it insulted me.' 135 chapters of comments. Starbuck_FirstMate: 'YTA. To be enraged with a dumb thing seems blasphemous.' Ishmael: 'Call me Ishmael. Not voting, I'm just here to explain the whale's head for 40 pages.' OneLegCaptain: 'thanks everyone. we sail at dawn.' WhiteWhale: 'ESH.'"

- id: carraway-deceive
  pool: true
  caption: "Every unreliable narrator starts with this exact sentence. The Great Gatsby, 1925."
  alt: "Homemade meme. 'Nick Carraway, narrator of The Great Gatsby, chapter 3:' over a sticker reading 'I am one of the few honest people that I have ever known.' Below, a doodled man in sunglasses with a cocktail: 'why would I deceive you?' and '*never tells the police who was driving the car* *helps his cousin cheat on her husband* *\"old sport\" x 40*'."

- id: yorick-doot
  pool: true
  caption: "Alas, poor Yorick. A fellow of infinite jest. Still."
  alt: "Homemade two-panel meme. Left: 'Hamlet: \"Alas, poor Yorick! I knew him, Horatio: a fellow of infinite jest\"' over a doodled Hamlet holding a skull. Right: 'Yorick:' over a big doodled skull playing a trumpet, 'doot doot.' Shakespeare, Hamlet, act 5."

- id: russian-starter-pack
  pool: true
  caption: "The Russian novel starter pack. Bring a bookmark, and a pen to write the names on it."
  alt: "Homemade starter-pack meme, 'reading a Russian novel starter pack': doodles labeled 'the list of names you wrote on your bookmark', 'a samovar (somebody is always making tea)', 'a duel at dawn over something said at a party', 'snow. so much snow.', '900 pages, 40 of them an argument about God', and 'a train (be careful around the train)'. Along the bottom: 'Rodion Romanovich Raskolnikov, also called Rodya, also Rodka, also Rodenka.'"

- id: alignment-chart
  pool: true
  height: 1350
  caption: "The classic literature alignment chart. Fight us in the comments."
  alt: "Homemade alignment chart of classic characters. Lawful good: Jane Eyre, leaves the man she loves because it's the right thing to do. Neutral good: Ishmael, just here to tell you about whales. Chaotic good: Huck Finn, 'All right, then, I'll go to hell.' Lawful neutral: Javert, chases one man for decades; it started with a loaf of bread. True neutral: Bartleby, would prefer not to. Chaotic neutral: Puck, gives a man a donkey's head, for fun. Lawful evil: Uriah Heep, so very 'umble, robs his boss blind. Neutral evil: Iago, ruins everyone's life, gives no real reason. Chaotic evil: Heathcliff, has his dead love's coffin opened, years later, to look."

- id: dinner-tier-list
  pool: true
  height: 1350
  caption: "Literary dinner guests, ranked. Who are you inviting? (Dracula's line is straight from the book.)"
  alt: "Homemade tier list, 'literary dinner guests.' S: Mr. Fezziwig, throws the best Christmas party in London, dances all night, pays for everything. A: Mr. Darcy, won't dance, insults you on arrival, secretly pays for your sister's wedding. B: the Mad Hatter, it's always six o'clock, so it's always tea time, no clean cups. C: Mr. Collins, will talk about his patroness, Lady Catherine de Bourgh, for three hours. D: Miss Havisham, the cake has been on the table for decades, she's still in the dress. F: Count Dracula, 'I have dined already, and I do not sup,' watches you eat, alone. F minus: Macbeth, sees a ghost in his own chair; his last guest of honor, the king, did not survive the night."

- id: trace-homer
  pool: true
  height: 1350
  caption: "The Iliad was made to be heard. It took about 2,700 years, but we got there."
  alt: "Homemade three-row meme. 'And yet a trace of the true self': a doodled poet with a lyre singing to a crowd, arrow, a scroll. Then the scroll, arrow, a thick book, THE ILIAD, '700 pages, read in silence.' 'Exists in the false self': the book, arrow, a phone with headphones playing the Iliad audiobook, 15 hours 4 minutes."

- id: trace-dickens
  pool: true
  height: 1350
  caption: "Dickens sold his novels in monthly parts, a shilling each, every one ending on a hook. Bleak House came out in 20 of them. Same energy as waiting for Friday's episode."
  alt: "Homemade three-row meme. 'And yet a trace of the true self': a magazine labeled 'Part 14, to be continued..., one shilling,' 'Dickens, sold in monthly parts,' arrow, a green leather-bound Complete Works, 'a leather-bound classic.' Then the Complete Works, arrow, a syllabus: 'weeks 1 to 6: Bleak House (all of it), essay due Friday, required reading.' 'Exists in the false self': the syllabus, arrow, a TV showing 'Episode 4, new episode Friday, to be continued...'"

- id: samsa-mondays
  caption: "Gregor Samsa wakes up as a giant insect, and his first worry is that he's missed his train to work. #GrrMondays, since 1915."
  alt: "Homemade meme. '#GrrMondays' in red over a doodle of a giant brown beetle lying in a bed under a blue blanket, with an alarm clock at 6:30. 'Gregor Samsa: wakes up as a giant bug. Also Gregor Samsa: \"oh no, I've missed the 5 o'clock train to work.\"' Franz Kafka, The Metamorphosis, 1915."

- id: reading-unwrapped
  height: 1350
  caption: "Your 2026 reading, unwrapped. Be honest: how many of the 46 are still in the bag?"
  alt: "Homemade year-in-review card on a pink-to-purple gradient: 'Your 2026 reading, unwrapped. You had a big year (buying books).' Books bought: 46. Books finished: 7. Top genre: 'I'll get to it.' Minutes in bookstores: 9,871. Minutes reading: 412. Most rewatched adaptation: Pride & Prejudice (2005), 11 times. Book on the nightstand since March: still there. 'You're in the top 1% of people who own two copies of the same book.'"

