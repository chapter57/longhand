  tags: [BookSky, Books, Literature, OnThisDay, Poetry, Writing]
  bluesky: |
    Longhand has a new look.

    Every day the almanac opens one new entry: a writer, a book or a moment from literary history. You can read everything that came before, but tomorrow's is still in the pen.

    Today: Sir Thomas Browne, who died on his 77th birthday.

